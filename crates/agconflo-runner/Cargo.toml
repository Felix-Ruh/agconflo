[package]
name = "agconflo-runner"
description = "Runs an Agconflo workflow from the documents that describe it: a manifest, its node types and scripts, a model mapping, and a record file."
version.workspace = true
edition.workspace = true
# Its own rather than the workspace's: std::fs::File::lock is from 1.89.
rust-version = "1.89"
license.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
agconflo-core = { path = "../agconflo-core" }
agconflo-lua = { path = "../agconflo-lua" }
genai = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# `unsafe_code = "forbid"` and clippy's `all` group, from the workspace. Without
# this table a member crate inherits none of them, silently.
[lints]
workspace = true

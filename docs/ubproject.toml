# Agconflo's documentation project.
#
# This file is the whole configuration. There is no conf.py and no Python: the
# toolchain is `ubc` (ubCode) alone, and `ubc` reads this file directly. The
# format is not a ubCode invention - it is sphinx-needs' own modern TOML
# configuration, which is what keeps the data portable if Sphinx is ever wanted
# back.
#
# ubc's project root is this directory, so `docs/` is what gets indexed and
# README.md at the repository root cannot be swept in. Install the pinned binary
# with `sh scripts/get-ubc.sh`; it is not on PATH, so invoke it by path, and from
# in here rather than by passing a path:
#
#     ( cd docs && ../tools/ubc check --deny warning )
#
# The cd is not a stylistic preference. `ubc check <path>` does not scope the
# check, it FILTERS THE DIAGNOSTICS - the whole project is resolved either way,
# but findings outside <path> are dropped silently.
#
# The rules that constrain these types - mandatory fields per level, link
# targets, link purity, requirement wording - live in schemas.json. Every one of
# them is proved to fire by a fixture in docs-selftest/, because a wrongly shaped
# rule can be silently ignored rather than rejected.
#
# Coverage rules are deliberately absent, and this list named one for a while by
# mistake. A coverage rule fires on every need that has not been built out yet,
# so it would block the first step of authoring. What is not yet covered is a
# question to ask a query, not a reason to refuse a commit.

"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

[project]
name = "Agconflo"
version = "0.0.0"

# -----------------------------------------------------------------------------
# KEEP EVERY BARE `needs` KEY IN THIS BLOCK, above the tables that follow.
#
# TOML assigns a bare key to whichever table header precedes it, so a key added
# at the end of this file lands inside the last [[needs.types]] entry instead of
# in [needs] - where ubc accepts it and silently ignores it, with `ubc check`
# still reporting no errors. Measured, after doing exactly that: the project ran
# with zero schema rules and looked perfectly healthy. Verify a change here with
# `ubc config`, not by the absence of complaints.
# -----------------------------------------------------------------------------

[needs]
# The rules. Relative to THIS file, and the one place they live - docs-selftest/
# inherits it through `extend`, so the fixtures test these rules rather than a
# copy of them.
#
# JSON carries no comments, so schemas.json cannot explain itself. Two
# conventions make up for that. Each rule's `id` is a self-explanatory sentence,
# because it is named in every finding `ubc check` prints. The `message` field
# holds the reasoning, and on the pinned 0.35.0 it is printed too, as a note
# under each finding - so it is read by whoever tripped the rule, and it appears
# in the self-test's golden files, where editing one moves its fixture's golden.
# And every rule has a fixture in docs-selftest/ that violates it, which is the
# working documentation of what it actually catches.
schema_definitions_from_json = "schemas.json"

# `id_required` DEFAULTS TO FALSE, which is the trap here: left alone, a need
# with no `:id:` is accepted and silently given a generated one. Generated ids
# are derived from content, so editing a requirement's text would change its
# identity and quietly break every link to it. Requirements must have stable,
# human-chosen ids, so this is mandatory rather than stylistic.
id_required = true

# Anchored at BOTH ends, deliberately. The built-in default is
# `^[A-Z0-9_]{5,}`, which is unanchored at the end and therefore accepts
# trailing junk - `STKH_FOO benign-looking-typo` passes it. Requiring a type
# prefix, an underscore, and an uppercase remainder to the end of the string
# means an id is either well formed or rejected.
#
# It stays deliberately general rather than listing the prefixes below: which
# prefix belongs to which TYPE cannot be expressed here at all, because a need's
# type is not available to this regex. That check is a schema rule, one per type.
id_regex = "^[A-Z]+_[A-Z0-9_]+$"

# -----------------------------------------------------------------------------
# Types.
#
# A level is a DECISION, not a paraphrase. Each one below carries at least one
# mandatory field that would be meaningless one level up, and the design test is
# that if such a field cannot be named, the level is fake and must not exist.
# That test is what removed `comp_arch`: in Rust the type system IS the detailed
# design, so a need restating a trait signature is restatement by construction.
#
# The prefixes are one-to-one with the types and deliberately do not overlap -
# COMP_ for a component, CREQ_ for a requirement allocated to one. `prefix` is
# NOT enforced by ubc, though: measured, a feat_req carrying the id
# STKH_MISPLACED passes every built-in check. Enforcement is a schema rule.
#
# A type is declared together with whatever produces it: `impl` with the code
# markers of the [codelinks] section below, and `test_run` with the importer in
# crates/junit-to-needs that writes one for each test in a runner's report.
# -----------------------------------------------------------------------------

[[needs.types]]
# The root: whose goal this is, and why the project would bother. Decided by
# `stakeholder`, which has no meaning further down - by then the goal is settled
# and only its realisation is in question.
directive = "stkh_req"
title = "Stakeholder Requirement"
prefix = "STKH_"

[[needs.types]]
# One observable behaviour of the product. Decided by `verification_method`:
# choosing how a behaviour will be shown to hold is a decision about the
# behaviour, and a stakeholder goal is not yet concrete enough to have one.
directive = "feat_req"
title = "Feature Requirement"
prefix = "FEAT_"

[[needs.types]]
# How a feature is decomposed. Decided by the set of components it names, so its
# mandatory field is the `uses` link - the first point at which the answer stops
# being about behaviour and starts being about structure.
directive = "feat_arch"
title = "Feature Architecture"
prefix = "ARCH_"

[[needs.types]]
# A component. An OBJECT rather than a level: nothing is derived from it, it is
# what requirements are allocated *to*. It exists as a need rather than as a
# string in a field so that `allocated_to` can be type-checked, and so that a
# component requirement's grammatical subject can be compared against the
# component's own title - which is what catches a requirement that merely
# restates its parent.
directive = "comp"
title = "Component"
prefix = "COMP_"

[[needs.types]]
# One behaviour of ONE component. Decided by `allocated_to`, which is the whole
# point of the level: a feature requirement deliberately does not say which part
# of the system is responsible.
directive = "comp_req"
title = "Component Requirement"
prefix = "CREQ_"

[[needs.types]]
# How a requirement is checked. Decided by `test_kind`, which encodes the
# testing policy - property-based wherever a property can be stated, alongside
# positive and error-path cases - and by `coverage`, since a case may verify a
# requirement fully or only in part. Test RESULTS are never authored here; they
# are imported from the test runner.
directive = "test_case"
title = "Test Case"
prefix = "TEST_"

[[needs.types]]
# A choice the project made and must not re-litigate. An OBJECT rather than a
# level: nothing is derived from it, and it decides nothing about the system's
# behaviour - it records why the system is shaped the way it is.
#
# It carries `statement`, deliberately, so a decision is held to exactly the same
# wording rules as a requirement. A decision hiding behind "we picked the simpler
# option" should be rejected, and it is, for free, by rules that already exist.
directive = "dec"
title = "Decision"
prefix = "DEC_"

[[needs.types]]
# A measurement a decision rests on. This project measures rather than assumes,
# and recorded evidence is what keeps a decision auditable once the thing it was
# measured against has moved on.
#
# IT DELIBERATELY DOES NOT USE `statement`, and that is the whole design. Every
# wording rule selects on that field, so the FIELD decides what is policed - and
# evidence is comparative and approximate by nature ("faster", "approximately
# 650 ms", "minimal"), which is precisely what those rules exist to ban from a
# requirement. Its finding lives in `observation` instead, which is subject to
# the constraints that suit a measurement and to none of the ones that do not.
# Never move it to `statement`: the rules would start firing on honest evidence,
# and nothing would flag the change as a mistake.
directive = "evd"
title = "Evidence"
prefix = "EVD_"

[[needs.types]]
# Where a component requirement is met in code. Not meant to be written in a
# document: each one is produced from a one-line marker in the Rust source,
# which keeps the trace beside the code it describes rather than in prose that
# drifts from it. Decided by `code_url`, which says where that code is, and by
# `implements`, which says what it answers for. Only the fixtures in
# docs-selftest/ write one by hand, because a diagnostic raised in Rust source
# carries an absolute path that no golden file could hold.
#
# The id comes from the marker, so nothing but the rules checks it.
directive = "impl"
title = "Implementation"
prefix = "IMPL_"

[[needs.types]]
# Code that follows a decision or a note and implements no component requirement,
# produced from a one-line marker like an implementation (DEC_TRACE_MARKERS). Not
# `code`, which is a built-in directive (EVD_CODELINKS_SECOND_TYPE).
directive = "trace"
title = "Trace"
prefix = "TRACE_"

[[needs.types]]
# An explanation local to one piece of code, written in docs/code/<crate>.rst and
# named by that code's marker (DEC_NOTES_BESIDE_THE_CRATE). Not `note`, which is
# reStructuredText's own admonition.
directive = "code_note"
title = "Note"
prefix = "NOTE_"

[[needs.types]]
# The latest run of one test case: how it went the last time it ran.
#
# NOT A HISTORY, deliberately. One run per test case, rewritten in place, so the
# imported file changes only when an outcome or an identity changes and its diff
# is worth reading. Git holds the history - which is also why a run carries
# neither timestamp nor duration: those differ between two runs of the same
# tests, so recording them would change the file on every run while saying
# nothing.
#
# Never written by hand outside docs-selftest/. Each one is imported from the
# runner's report by crates/junit-to-needs, which names it after the test case
# it ran. Decided by `test_outcome`, and by `executes`, which says which case
# that was.
directive = "test_run"
title = "Test Run"
prefix = "RUN_"

# -----------------------------------------------------------------------------
# Links.
#
# NO LINK MAY DANGLE AT AUTHORING TIME: whatever a need refers to already exists
# when that need is written. `allow_dead_links` is left at its default of false,
# so a broken reference is a diagnostic rather than a silent hole.
#
# Pointing up the V is how most of them manage it, from the concrete to the
# abstract, the abstract having been written first. The two decision links manage
# it by pointing the other way, for the reason given beside them.
#
# So the invariant is the ABSENCE OF DANGLING REFERENCES, not the direction. This
# header used to state the direction as though it were the rule, and then stayed
# that way for four commits after the exceptions were added directly below it -
# which is the argument for stating a rule by what it guarantees rather than by
# how it is usually achieved.
#
# Which types a link may join is not expressible here - that is a schema rule -
# and neither is cardinality, so `allocated_to` accepting exactly one component
# is enforced there as well.
#
# ubc's built-in `links` type survives these declarations rather than being
# replaced by them (measured), which is why docs-selftest still uses it for the
# dead-link fixture: it belongs to no level and so cannot go stale.
# -----------------------------------------------------------------------------

[needs.links.derived_from]
outgoing = "derived from"
incoming = "derives"
description = "The requirement one level up that this one refines."

[needs.links.realises]
outgoing = "realises"
incoming = "realised by"
description = "The feature requirement this architecture decision serves."

[needs.links.uses]
outgoing = "uses"
incoming = "used by"
description = "A component this architecture decision decomposes the feature into."

[needs.links.allocated_to]
outgoing = "allocated to"
incoming = "allocates"
description = "The single component answerable for this requirement."

[needs.links.verifies]
outgoing = "verifies"
incoming = "verified by"
description = "The requirement this test case checks."

# Its own link rather than ubc's built-in `links`, which a code marker would fill
# by default. `links` belongs to no level, which is exactly why docs-selftest's
# dead-link fixture uses it: giving it a meaning here would tie that fixture to
# the implementation level. Measured: a marker's last field can populate a
# custom list link instead (EVD_CODELINKS_CUSTOM_LINK).
[needs.links.implements]
outgoing = "implements"
incoming = "implemented by"
description = "The component requirement this code answers for."

# A marker's second list: the decisions and notes the code follows
# (DEC_CODE_FOLLOWS_BY_MARKER, EVD_CODELINKS_SECOND_LIST).
[needs.links.follows]
outgoing = "follows"
incoming = "followed by"
description = "A decision or note this code follows."

# Its own link rather than `verifies`, which a test case carries to the
# requirement it checks. A run checks nothing: it says how one case fared the
# last time it ran, and the two would be indistinguishable in a query if they
# shared a link name.
[needs.links.executes]
outgoing = "executes"
incoming = "executed by"
description = "The test case this run executed."

# The two links below are the exception to that direction, and it is justified by
# the rule's own reason rather than in spite of it. Links point up the V so they
# cannot dangle at authoring time; here the evidence is recorded BEFORE the
# decision it supports, and a superseded decision exists before the one that
# replaces it. In both cases the link therefore belongs on the need written
# second, which is the later one, so it still cannot dangle.
#
# Both are optional. A decision often rests on reasoning rather than on a
# measurement, and requiring evidence would block writing one down before its
# evidence existed - the same authoring-blocking failure that kept the coverage
# rules out of the metamodel.

[needs.links.supported_by]
outgoing = "supported by"
incoming = "supports"
description = "Evidence this decision rests on."

[needs.links.supersedes]
outgoing = "supersedes"
incoming = "superseded by"
description = "The earlier decision this one replaces."

# -----------------------------------------------------------------------------
# Fields.
#
# THESE DECLARATIONS ALREADY ENFORCE. An `enum` here is a real gate: a value
# outside it is reported as `needs.invalid_field_value`, and although that is a
# WARNING rather than an error, every gate in this repository runs
# `--deny warning`, so it fails the build. Each enum therefore has a fixture in
# docs-selftest/ that violates it.
#
# The enum messages truncate above three values - `"a", "b" or 4 other
# candidates` - so a fixture's golden file pins the first two values and the
# count. That is enough to force a diff when a value set changes, which matters
# most for `ears_pattern`, whose set is provisional until there are enough real
# requirements to judge it.
#
# Fields are global, not per-type: nothing here says which type may carry which
# field, and mandatory-per-level is a schema rule.
# -----------------------------------------------------------------------------

[needs.fields.statement]
# The single normative sentence, and the thing every wording rule is applied to.
#
# IT IS A FIELD RATHER THAN THE NEED'S BODY, and that is forced rather than
# chosen: measured, a need's `content` is invisible to schema validation. An
# impossible pattern on it matches nothing, and declaring content as a field
# does not help - the key is simply absent from the data the validator sees. So
# the body holds rationale and derivation, the prose a person writes around the
# requirement, and the obligation itself lives here where it can be checked.
#
# The bounds are crude guards against the two ways this field goes wrong -
# a placeholder and a pasted paragraph - and not quality measures. 20 is about
# the shortest legitimate EARS sentence ("Agconflo shall stop." is exactly 20),
# so it admits that while rejecting "TBD" or "see body". 240 is roughly forty
# words: generous for one sentence, tight enough that a paragraph fails.
#
# A STATEMENT MUST BE ONE PHYSICAL LINE, enforced as a rule in schemas.json
# rather than here. Measured: a wrapped field value keeps a literal newline in
# it, so a wrapped statement would fail every anchored grammar rule with a
# baffling message. Refusing the newline outright is also the honest data
# constraint - these statements are rendered into prompts and read through
# needs.json, where a line break inside a sentence is noise. Long statements
# therefore make long lines, which nothing here wraps.
description = "The single normative sentence, on one line. Rationale belongs in the body."
nullable = true
schema = { type = "string", minLength = 20, maxLength = 240 }

[needs.fields.ears_pattern]
# Which EARS template the statement follows (Mavin et al.), which decides which
# grammar the statement is held to.
#
# EXACTLY THE SIX EARS PATTERNS, and the tempting seventh - a `constraint` value
# for quality attributes and architectural constraints - is deliberately absent:
# such a statement is grammatically identical to a ubiquitous one, so no rule
# could tell them apart, and these values are required to be mutually exclusive
# with exactly one appropriate per requirement. The six are exclusive because
# each is identified by its opener: none, While, When, Where, If/then, and
# While+when. Quality attributes are therefore `ubiquitous`, and for them this
# field constrains little - their quality comes from the smell rules instead.
#
# Named `ears_pattern` rather than `pattern` on purpose. The rules that use it
# read `properties.ears_pattern.const` directly beside
# `properties.statement.pattern`, where `pattern` is JSON Schema's own keyword,
# and one word meaning two things in adjacent lines is a trap for whoever edits
# them next.
description = "Which EARS pattern the statement follows."
nullable = true
schema = { type = "string", enum = [
    "ubiquitous",
    "state",
    "event",
    "optional",
    "unwanted",
    "complex",
] }

[needs.fields.verification_method]
# What makes a feature requirement a level of its own. Deliberately coarse: it
# records the KIND of evidence that will settle the requirement, not the test
# that produces it, which is a test_case linked by `verifies`.
description = "How this requirement is to be verified."
nullable = true
schema = { type = "string", enum = ["test", "analysis", "review", "demonstration"] }

[needs.fields.stakeholder]
# Whose goal a stakeholder requirement is.
#
# Three values, chosen to be mutually exclusive rather than exhaustive: someone
# running workflows, an LLM operating or authoring them, or someone working on
# Agconflo itself. `agent` is not decoration - agents are the primary readers of
# this graph, and requirements that exist for their benefit are real. An earlier
# split into author and contributor was dropped: both are maintainers, and a
# value set nobody can apply unambiguously is worse than a coarser one.
description = "Whose goal this is."
nullable = true
schema = { type = "string", enum = ["user", "agent", "maintainer"] }

[needs.fields.crate]
# Where a component lives. Left as a free string rather than an enum of crate
# names: an enum would have to be edited in lockstep with the workspace members
# in Cargo.toml, for no gain over a rule that can check it later.
description = "Where this component lives in the workspace."
nullable = true
schema = { type = "string" }

[needs.fields.code_url]
# Where an implementation is, filled in by codelinks from the marker's own
# location rather than written by anyone. Measured: a value filled in this way
# is visible to schema validation, where a need's body is not
# (EVD_CODELINKS_URL_VISIBLE), so a rule can require it.
#
# It holds a permalink into the repository at the commit being checked; the
# [codelinks] section at the end of this file says why that and not a local
# file URL. Left a free string, since a pattern here would be a rule with a
# fixture of its own, guarding a value only codelinks writes.
description = "Where this implementation lives in the source."
nullable = true
schema = { type = "string" }

[needs.fields.test_kind]
# The testing policy, made checkable. Every expected failure mode gets an
# error-path case asserting WHICH error occurs and what happens next, because a
# failure mode that is never asserted is a failure mode that was never designed.
description = "Which kind of test this case is."
nullable = true
schema = { type = "string", enum = ["property", "positive", "error_path"] }

[needs.fields.coverage]
# Whether one case settles its requirement or only part of it.
#
# This is a field rather than a second link type (`fully_verifies` alongside
# `partially_verifies`) for a mechanical reason: `validate.network_back` with two
# link keys is an AND over both, so a coverage rule spanning two link types
# cannot be written at all. One link plus this field says the same thing and
# keeps every rule to a single link key.
description = "Whether this case verifies its requirement fully or in part."
nullable = true
schema = { type = "string", enum = ["full", "partial"] }

[needs.fields.test_outcome]
# How the last run of a test case went.
#
# TWO VALUES, measured rather than chosen. nextest writes no entry at all into
# its report for a test it skipped (EVD_NEXTEST_IGNORED_ABSENT), so nothing the
# importer reads can have been skipped, and a third value nothing produces would
# be fiction that every query has to allow for. An importer meeting an outcome
# it cannot map - a skipped test, or one retried until it passed - refuses the
# report and says which test, rather than choosing a value here.
description = "How the last run of this test case went."
nullable = true
schema = { type = "string", enum = ["passed", "failed"] }

[needs.fields.dec_status]
# Whether a decision is still current. Load-bearing rather than decorative: this
# project has reversed itself more than once - the Python toolchain, the
# obligation living in a need's body, the detailed-design level - and a graph
# that presented a superseded decision as current would be worse than one that
# never recorded the decision at all.
description = "Whether this decision is current."
nullable = true
schema = { type = "string", enum = ["accepted", "superseded", "rejected"] }

[needs.fields.evd_kind]
# How the evidence was obtained, which is the same question as how it could be
# re-checked. The four values are mutually exclusive and, usefully, ordered by
# strength: something run here beats a throwaway prototype, which beats what a
# vendor says about their own product, which beats a citation.
description = "How this evidence was obtained."
nullable = true
schema = { type = "string", enum = ["measurement", "prototype", "vendor_doc", "literature"] }

[needs.fields.observation]
# What was measured - the evidence counterpart of `statement`, and separate from
# it on purpose. See the `evd` type above for why folding this into `statement`
# would quietly subject every measurement to the requirement smell rules.
#
# Same bounds and the same one-line constraint as `statement`, for the same
# reasons: the bounds guard against a placeholder and against a pasted paragraph,
# and one physical line keeps a value that gets rendered into prompts free of
# stray breaks. Both of those constraints are enforced for this field by rules of
# its own in schemas.json rather than by the ones written for `statement`, since
# those select on the FIELD and an evidence need carries no statement at all.
description = "What was observed, on one line."
nullable = true
schema = { type = "string", minLength = 20, maxLength = 240 }

[needs.fields.decided_on]
# When the decision was taken, which is not when it was committed and is the date
# that matters when reading a supersedes chain.
description = "The date this was decided, as YYYY-MM-DD."
nullable = true
schema = { type = "string", pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }

[needs.fields.observed_on]
# When the measurement was taken. Evidence goes stale: nearly all of it here was
# measured against one pinned `ubc`, and a finding with no date can be neither
# re-checked nor retired.
#
# A `pattern` in a field's schema enforces exactly as an `enum` does - measured,
# and reported as needs.invalid_field_value at warning severity, which fails
# every gate here because they all pass --deny warning. This is a separate field
# from `decided_on` rather than one shared `dated`: the two mean different
# things, and the primary readers of this graph are agents, for whom
# `observed_on` says what it holds where `dated` would not.
description = "The date this was observed, as YYYY-MM-DD."
nullable = true
schema = { type = "string", pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }

# -----------------------------------------------------------------------------
# Test results.
#
# test-runs.json holds one `test_run` per test, written by
# scripts/import-test-runs.sh from the report nextest leaves at
# target/nextest/default/junit.xml. The file is COMMITTED, and both gates check
# that it still matches what the tests produce without ever rewriting it.
#
# Committed rather than produced when the project is checked: an absent file is
# reported as a warning, which fails at the `--deny warning` every gate here
# uses and passes at `--deny error` (EVD_EXTERNAL_MISSING_WARNS), so on demand
# would mean a fresh clone could not check its documentation until it had built
# and run the tests. An empty one is legal, which is what lets the import be
# wired before any test has run.
#
# It is not a source document: `source.include` is `*.rst`, so this JSON is read
# only through this entry and counts toward nothing else.
#
# `base_url` is required - without it the check reports a gating warning - and
# is where a reader is sent for a run: the file itself, since a run has no page
# of its own.
# -----------------------------------------------------------------------------

[[needs.external_needs]]
json_path = "test-runs.json"
base_url = "https://github.com/Felix-Ruh/agconflo/blob/main/docs/test-runs.json"

# -----------------------------------------------------------------------------
# Code.
#
# codelinks reads one-line markers from the Rust source and turns each into an
# `impl` need, which docs/code/<crate>.rst brings into the graph with a
# `src-trace` directive. A marker is an ordinary comment:
#
#     // @<title>,<IMPL id>,impl,[<component requirement ids>],[<decision or note ids>]
#     // @<title>,<TRACE id>,trace,[],[<decision or note ids>]
#
# ONE-LINE MARKERS ONLY. `@need-ids:` references are switched off: two call
# sites referencing one need keep only the first, with no diagnostic, where two
# markers both survive with their own locations (EVD_NEED_ID_REFS_KEEP_FIRST).
#
# The include glob must begin with `**/`. It is NOT relative to `src_dir`:
# measured, a pattern written relative to it matched nothing and the check
# stayed green with no code traced at all (EVD_CODELINKS_INCLUDE). This one
# also keeps a crate-local target/ and every other crate out.
#
# `code_url` is a permalink into the repository at the commit being checked:
# the same on every machine, and valid once pushed. `{commit}` is HEAD and
# `{line}` comes from the working tree, so an uncommitted edit points a link at
# the wrong line until it is committed; CI checks a clean tree, where they
# agree (EVD_CODELINKS_REMOTE_URL). The value is computed at every index and
# never committed. A local file URL was the alternative, and it names one
# machine's absolute path.
#
# docs-selftest/ inherits all of this through `extend`, harmlessly: code needs
# appear only where a src-trace directive asks for them, and the Rust files do
# not count toward the unlicensed five-file tier the fixtures rely on
# (EVD_CODELINKS_FREE_TIER).
# -----------------------------------------------------------------------------

[codelinks]
set_remote_url = true
remote_url_field = "code_url"

[codelinks.projects.agconflo-core]
remote_url_pattern = "https://github.com/Felix-Ruh/agconflo/blob/{commit}/{path}#L{line}"

[codelinks.projects.agconflo-core.source_discover]
src_dir = "../crates"
include = ["**/agconflo-core/src/**/*.rs"]
comment_type = "rust"

[codelinks.projects.agconflo-core.analyse]
get_oneline_needs = true
get_need_id_refs = false

[codelinks.projects.agconflo-core.analyse.oneline_comment_style]
start_sequence = "@"
end_sequence = "\n"
field_split_char = ","
# `implements` in the place of the default `links`: see [needs.links.implements].
# `follows` after it: see [needs.links.follows].
needs_fields = [
    { name = "title", type = "str" },
    { name = "id", type = "str" },
    { name = "type", type = "str", default = "impl" },
    { name = "implements", type = "list[str]", default = [] },
    { name = "follows", type = "list[str]", default = [] },
]

# The same shape for agconflo-lua: one project per crate, so each crate's
# markers are brought into the graph by its own docs/code/<crate>.rst.
[codelinks.projects.agconflo-lua]
remote_url_pattern = "https://github.com/Felix-Ruh/agconflo/blob/{commit}/{path}#L{line}"

[codelinks.projects.agconflo-lua.source_discover]
src_dir = "../crates"
include = ["**/agconflo-lua/src/**/*.rs"]
comment_type = "rust"

[codelinks.projects.agconflo-lua.analyse]
get_oneline_needs = true
get_need_id_refs = false

[codelinks.projects.agconflo-lua.analyse.oneline_comment_style]
start_sequence = "@"
end_sequence = "\n"
field_split_char = ","
# `implements` in the place of the default `links`: see [needs.links.implements].
# `follows` after it: see [needs.links.follows].
needs_fields = [
    { name = "title", type = "str" },
    { name = "id", type = "str" },
    { name = "type", type = "str", default = "impl" },
    { name = "implements", type = "list[str]", default = [] },
    { name = "follows", type = "list[str]", default = [] },
]

# The metamodel's self-test project.
#
# Every file under fixtures/ breaks exactly one rule on purpose, and
# expected/<name>.txt holds the exact diagnostics that break must produce.
# scripts/docs-selftest.sh drives the comparison; run it by hand with
#
#     sh scripts/docs-selftest.sh
#
# The gate_<name>.rst and report_<name>.rst fixtures are the exception. They
# trip a Cypher query in scripts/gates/ or scripts/reports/ and no schema rule,
# so their golden files record no diagnostics on purpose - that is the evidence
# the query is needed at all. scripts/cypher-gates.sh reads them by a naming
# convention instead.
#
# WHY A WHOLE DIRECTORY OF BROKEN NEEDS EXISTS. A wrongly shaped schema rule can
# be silently ignored by ubc - two of the four shapes measured still are on
# 0.35.0, see EVD_UBC035_RULE_SHAPES and scripts/docs-selftest.sh - and a rule
# of the right shape can match the wrong thing. So a rule that has never been
# seen to fail cannot be assumed to work, and "the schema checks passed" means
# nothing on its own.
#
# THIS IS A SEPARATE PROJECT, AND A SIBLING OF docs/ RATHER THAN A CHILD OF IT.
# Source include patterns are recursive, so a docs/selftest/ would sweep every
# deliberately-invalid need here into the real requirements project.
#
# Running `ubc check` in this directory by hand, or opening it in the editor,
# reports all the fixture diagnostics at once. That is correct and expected -
# they are the point. Silencing them with lint.per_file_ignores would blind the
# driver too, so they are left visible.

"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

# THE LOAD-BEARING LINE. The fixtures test the rules of the real project, not a
# copy of them: `extend` inherits the need types, the link types, the fields,
# id_required, id_regex and schemas.json itself, so a rule cannot drift out of
# coverage by being edited in one file and not the other.
#
# It inherits the [codelinks] configuration too, and that is harmless: code
# needs appear only where a src-trace directive asks for them, which no fixture
# does, and the Rust files it traces do not count toward the unlicensed
# five-file tier (EVD_CODELINKS_FREE_TIER).
#
# Measured: relative paths inside the extended file resolve against THAT file,
# so the inherited `schema_definitions_from_json` will point at docs/, not here.
#
# Three fixtures fail loudly if this ever stops working: id_required (whose
# default is false, so the diagnostic would vanish), ok_minimal (whose stkh_req
# would become an unknown directive), and id_regex (whose message quotes our own
# pattern rather than ubc's default).
extend = "../docs/ubproject.toml"

[project]
name = "Agconflo metamodel self-test"

# THE ONE THING NOT INHERITED, and it has to be switched off explicitly.
#
# The real project imports docs/test-runs.json as external needs. Inherited
# here, that path resolves against docs/ and the runs are loaded into EVERY
# fixture, where the test cases they execute do not exist: measured, each
# one-file check gained 38 errors and 19 warnings of dead links, and their
# diagnostics named the JSON by an ABSOLUTE path, which no golden file could
# hold on two operating systems.
#
# An empty array clears the inherited list - measured, `ubc config` then reports
# none and the fixtures check clean again. Removing these two lines reddens all
# 27 fixtures at once, which is the standing proof that it is load-bearing.
[needs]
external_needs = []

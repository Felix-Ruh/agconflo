[workspace]
resolver = "3"
members = [
    "crates/agconflo-core",
    "crates/agconflo-cli",
    "crates/agconflo-lua",
    "crates/agconflo-runner",
    "crates/junit-to-needs",
]

# Shared metadata. Member crates opt in with `field.workspace = true`.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Felix Ruh <agconflo@mailbox.org>"]
readme = "README.md"

# Shared dependency versions. Member crates opt in with `dep.workspace = true`.
[workspace.dependencies]
# agconflo-core reads and writes workflow documents with toml_edit alone: one
# parse gives both the values read and the document the writer edits in place.
# Pinned exactly, because DEC_TOPOLOGY_IN_TOML rests on measurements of this
# release - moving it means re-measuring first.
toml_edit = "=0.25.15"

# agconflo-lua runs node behaviour as Lua 5.5 scripts (DEC_BEHAVIOUR_IN_LUA),
# built from source by `vendored`, so no Lua need be installed. Pinned exactly,
# because every sandbox finding in evidence/behaviour was measured on this
# release - moving it means measuring again first.
mlua = { version = "=0.12.1", features = ["lua55", "vendored", "async"] }

# agconflo-lua reaches language models through genai (DEC_MODELS_THROUGH_GENAI),
# pinned exactly at the newest release, a pre-release, on which every finding in
# evidence/models was measured. tokio drives it in the tests, which answer with
# a stub on the loopback interface rather than a provider.
genai = "=0.7.0-beta.24"
tokio = { version = "=1.53.1", features = ["rt", "macros", "net", "io-util", "time"] }

# agconflo-cli reads its command line with clap (DEC_COMMAND_LINE_THROUGH_CLAP),
# pinned exactly at the newest release.
clap = { version = "=4.6.7", features = ["derive"] }

# Testing policy: property-based tests wherever a property can be stated,
# alongside positive tests and error-path ("negative") tests.
proptest = "1.11"

# junit-to-needs: nextest's own JUnit model reads the report, and serde_json
# writes the needs file. chrono and uuid are what quick-junit's setters take,
# needed only by tests that vary a report's timestamps and run id.
quick-junit = "0.8.0"
serde_json = "1.0.151"
thiserror = "2.0.20"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
uuid = "1.17.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
